# Hybrid + reranker.  Example from the readme, section 3.1.5.
# config_id is not written by hand: it becomes hybrid_rrf_rerank@<first 8 hash chars>.
collection: mdd_current
allowed_collections: [mdd_current, rudn_current]
embedding: {model: BAAI/bge-m3}
query:
  max_tokens: 256
  dictionary: {enabled: false, path: dictionaries/rudn_synonyms.yaml}
search:
  mode: hybrid
  prefetch_limit: 50
  candidates: 40
  fusion: {type: rrf, k: 60}
rerank: {enabled: true, model: BAAI/bge-reranker-v2-m3, max_length: 512, batch_size: 16}
postprocess: {max_per_doc: 2}
top_k_default: 5
top_k_max: 20
no_relevant: {signal: rerank_score, threshold: null}
