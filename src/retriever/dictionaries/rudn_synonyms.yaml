# RUDN synonym / abbreviation dictionary (C-RET-02).
#
# Rules: expansion happens on word boundaries; the original word is kept and the
# full form is appended.  Ambiguous entries (ambiguous: true) are only expanded
# when a context word is present.  The version participates in config_id.
version: 1
entries:
