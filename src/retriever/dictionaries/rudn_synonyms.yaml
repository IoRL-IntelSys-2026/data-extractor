  - {term: общаговский, expand: [общежитие], type: slang, ambiguous: false}
  - {term: стипуха, expand: [стипендия], type: slang, ambiguous: false}
  - {term: ПК, expand: ["приёмная комиссия"], type: abbr, ambiguous: true, context: [поступление, документы, подать, абитуриент]}
  - {term: ПК, expand: ["повышение квалификации"], type: abbr, ambiguous: true, context: [курсы, преподаватель, обучение]}
  - {term: РУДН, expand: ["Российский университет дружбы народов"], type: abbr, ambiguous: false, source: "взять с сайта"}
  - {term: СПО, expand: ["среднее профессиональное образование"], type: abbr, ambiguous: false}
  - {term: бакалавриат, expand: [бакалавр], type: synonym, ambiguous: false}
  - {term: магистратура, expand: [магистр], type: synonym, ambiguous: false}
  - {term: аспирантура, expand: [аспирант], type: synonym, ambiguous: false}
