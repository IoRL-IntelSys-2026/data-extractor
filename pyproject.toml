[project]
name = "retriever"
version = "0.1.0"
description = "Retriever service for the RAG system (team RET, D7)"
authors = [
    {name = "RET team",email = "ret@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "qdrant-client>=1.19,<1.20",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "dotenv (>=0.9.9,<0.10.0)",
]

[project.optional-dependencies]
embeddings = [
    "FlagEmbedding>=1.2",
    "torch>=2.1",
]
rerank = [
    "FlagEmbedding>=1.2",
    "torch>=2.1",
]
eval = [
    "pandas>=2.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
retriever-api = "retriever.api:main"
ret-eval = "retriever.eval.runner:main"

[tool.poetry]
packages = [
    { include = "retriever", from = "src" },
    { include = "rag_common", from = "src" },
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
markers = [
    "integration: tests that need a running Qdrant",
]
testpaths = ["tests"]
pythonpath = ["."]

